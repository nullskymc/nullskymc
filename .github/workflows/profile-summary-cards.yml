name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.SUMMARY_CARD_TOKEN }}

      - name: Generate Top Languages SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.SUMMARY_CARD_TOKEN }}

      - name: Validate generated SVGs
        run: |
          if grep -qiE "Something went wrong|Resource not accessible" profile/*.svg; then
            echo "::error::GitHub statistics generation failed"
            grep -iE "Something went wrong|Resource not accessible" profile/*.svg || true
            exit 1
          fi

      - name: Commit and push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update readme stats"
          git push
